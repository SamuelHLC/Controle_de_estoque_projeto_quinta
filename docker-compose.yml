# ══════════════════════════════════════════════════════════════════════
#  docker-compose.yml — Sistema Distribuído de Estoque
#
#  Serviços:
#    servidor-estoque  — núcleo concorrente (mutex + semáforo POSIX)
#    cliente-pdv       — interface de compras (subir manualmente)
#    admin-painel      — CRUD de estoque (acessa estoque.dat direto)
#
#  Redes : rede-estoque (bridge interna isolada)
#  Volumes:
#    ./logs       → /logs   (logs persistentes)
#    dados-estoque          (estoque.dat compartilhado entre server+admin)
#
#  CORRECOES:
#  [1] container_name removido do cliente-pdv — nome fixo impedia o uso
#      de --scale (Docker rejeita multiplos containers com o mesmo nome).
#
#  [2] depends_on do admin-painel migrado para condition: service_healthy
#      garantindo que o admin so sobe apos o servidor estar de fato pronto.
#
#  [3] cliente-pdv movido para profile "manual" — nao sobe mais sozinho
#      com docker-compose up, evitando poluir o terminal do servidor.
#      Use: docker-compose run --rm cliente-pdv
# ══════════════════════════════════════════════════════════════════════

services:

  # ── Servidor: núcleo de processamento distribuído ────────────────────
  servidor-estoque:
    build:
      context: .
      dockerfile: Dockerfile
    image: estoque/app:latest
    container_name: servidor-estoque
    command: /app/build/servidor

    networks:
      - rede-estoque

    volumes:
      - ./logs:/logs
      - dados-estoque:/app/data

    working_dir: /app/data

    environment:
      SERVIDOR_HOST: "0.0.0.0"
      SERVIDOR_PORT: "8085"
      LOG_DIR: "/logs"

    restart: unless-stopped

    healthcheck:
      # FIX: pgrep nao conecta no socket, evita logs espurios a cada 5s
      test: ["CMD-SHELL", "pgrep servidor > /dev/null && echo ok"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  # ── Cliente PDV: subir manualmente quando precisar ───────────────────
  # FIX [3]: profile "manual" impede subida automatica com docker-compose up
  # O terminal do servidor fica limpo, mostrando apenas logs reais.
  #
  # Para abrir um cliente:
  #   docker-compose run --rm cliente-pdv
  #
  # Para abrir N clientes em terminais diferentes (modo simulacao):
  #   docker-compose run --rm cliente-pdv  (terminal 1)
  #   docker-compose run --rm cliente-pdv  (terminal 2)
  #   docker-compose run --rm cliente-pdv  (terminal 3)
  cliente-pdv:
    image: estoque/app:latest
    command: /app/build/cliente
    profiles: ["manual"]

    networks:
      - rede-estoque

    volumes:
      - ./logs:/logs

    environment:
      SERVIDOR_HOST: "servidor-estoque"
      SERVIDOR_PORT: "8085"
      LOG_DIR: "/logs"

    depends_on:
      servidor-estoque:
        condition: service_healthy

    stdin_open: true
    tty: true

  # ── Admin: painel de CRUD (acessa estoque.dat direto) ────────────────
  # Rode manualmente quando precisar:
  #   docker-compose run --rm admin-painel
  admin-painel:
    image: estoque/app:latest
    container_name: admin-painel
    command: /app/build/admin
    profiles: ["manual"]

    networks:
      - rede-estoque

    volumes:
      - ./logs:/logs
      - dados-estoque:/app/data

    working_dir: /app/data

    environment:
      LOG_DIR: "/logs"

    depends_on:
      servidor-estoque:
        condition: service_healthy

    stdin_open: true
    tty: true

    restart: "no"

# ── Rede interna isolada ────────────────────────────────────────────────
networks:
  rede-estoque:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

# ── Volumes ─────────────────────────────────────────────────────────────
volumes:
  dados-estoque:

# ══════════════════════════════════════════════════════════════════════
#  COMANDOS ÚTEIS
#
#  Subir apenas o servidor:
#    docker-compose up --build
#
#  Abrir cliente (em outro terminal):
#    docker-compose run --rm cliente-pdv
#
#  Abrir painel admin (em outro terminal):
#    docker-compose run --rm admin-painel
#
#  Ver logs em tempo real:
#    docker-compose logs -f servidor-estoque
#
#  Helgrind (race conditions) no servidor:
#    docker exec -it servidor-estoque \
#      valgrind --tool=helgrind --log-file=/logs/helgrind.log \
#               /app/build/servidor
#
#  Derrubar tudo:
#    docker-compose down -v
# ══════════════════════════════════════════════════════════════════════
